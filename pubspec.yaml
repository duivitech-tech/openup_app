name: openup_app
description: "OpenUp — Someone's listening. A private, session-based AI conversation platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & routing
  get: ^4.6.6

  # HTTP client
  dio: ^5.4.0

  # Secure local storage
  flutter_secure_storage: ^9.0.0

  # Device identification
  device_info_plus: ^10.1.0

  # Typography
  google_fonts: ^6.2.1

  # Shimmer loading effect
  shimmer: ^3.0.0

  # In-app WebView for payment
  flutter_inappwebview: ^6.0.0

  # UUID generation
  uuid: ^4.3.3

  # Socket.IO client for AI chat
  socket_io_client: ^2.0.3+1

  # Date/time formatting
  intl: ^0.19.0

  # URL launcher (for app update store link)
  url_launcher: ^6.3.0

  # Package info (versionCode / version name) for update-check
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
